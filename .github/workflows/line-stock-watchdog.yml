name: line-stock-watchdog
on:
  workflow_dispatch:
  schedule:
    - cron: "17,32,47 12-13 * * 1-5"
concurrency:
  group: line-stock-watchdog
  cancel-in-progress: false
jobs:
  ensure-line-stock-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check actual delivery and recover
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/line_watchdog.py
